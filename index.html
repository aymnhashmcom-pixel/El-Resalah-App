<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B4332">
    <title>تطبيق الرسالة</title>

    <!-- Open Graph Tags لمعاينة الصورة والكرت عند المشاركة في واتساب وفيس بوك -->
    <meta property="og:title" content="تطبيق الرسالة 📱" />
    <meta property="og:description" content="تطبيق إسلامي متكامل: أذكار المسلم، القرآن الكريم صوت وصورة، مواقيت الصلاة والأذان، وتذكير الصيام." />
    <meta property="og:image" content="https://aymnhashmcom-pixel.github.io/El-Resalah-App/icon-512.png" />
    <meta property="og:url" content="https://aymnhashmcom-pixel.github.io/El-Resalah-App/" />
    <meta property="og:type" content="website" />

    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #F4F7F4;
            --primary: #1B4332;
            --secondary: #2D6A4F;
            --accent: #E8F5E9;
            --gold-soft: #C59B27;
            --text-dark: #2B2D42;
            --shadow-soft: 0 8px 20px rgba(27, 67, 50, 0.12);
            --shadow-btn: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0,0,0,0.06);
        }

        .header-card {
            background: linear-gradient(145deg, var(--primary), var(--secondary));
            color: white; padding: 25px 20px 22px;
            border-radius: 0 0 24px 24px; text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .header-card h1 { font-size: 1.75rem; color: #E8F5E9; margin-bottom: 4px; font-weight: 700; }
        .sub-title { font-size: 0.9rem; color: #F3E5AB; font-weight: 600; margin-bottom: 8px; }
        .header-card p { font-size: 0.85rem; opacity: 0.92; font-style: italic; }

        .action-bar {
            display: flex;
            gap: 10px;
            padding: 16px 20px 0;
        }

        .btn-main {
            flex: 1;
            background: linear-gradient(135deg, #2D6A4F, #1B4332);
            color: #FFFFFF;
            border: none;
            padding: 13px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(27, 67, 50, 0.3);
            transition: all 0.2s ease;
        }

        .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

        .btn-share {
            background: linear-gradient(135deg, #D4AF37, #B8901C);
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
        }

        .main-content { padding: 20px; flex: 1; }
        .section-title { font-size: 1.05rem; color: var(--primary); margin-bottom: 14px; font-weight: 700; }

        .category-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-btn);
            border: 1px solid rgba(45, 106, 79, 0.08);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-card:active { transform: scale(0.98); background-color: #F0F7F4; }
        .card-info { display: flex; align-items: center; gap: 14px; }
        
        .icon-box {
            width: 44px; height: 44px; border-radius: 12px;
            background: #E8F5E9; color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
        }

        .card-title { font-size: 0.98rem; font-weight: 700; color: #2D3748; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45); z-index: 1000; align-items: flex-end;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: white; width: 100%; max-width: 480px; margin: 0 auto;
            border-radius: 22px 22px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #edf2f7; padding-bottom: 10px; }
        .close-btn { font-size: 1.4rem; cursor: pointer; color: #A0AEC0; }

        .azkar-item {
            background: #F8FAFC;
            border-right: 4px solid var(--secondary);
            padding: 14px; border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .azkar-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .azkar-title { color: var(--primary); font-weight: 700; font-size: 0.95rem; }
        
        .audio-btn {
            background: var(--primary);
            color: white; border: none; padding: 7px 14px;
            border-radius: 10px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 6px rgba(27, 67, 50, 0.2);
        }

        .audio-btn:active { background: var(--secondary); }

        .prayer-time-card { background: var(--primary); color: white; padding: 12px 18px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        .qibla-compass-box { text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #CBD5E0; }
        .qibla-compass { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--gold-soft); margin: 10px auto; display: flex; align-items: center; justify-content: center; position: relative; background: #FFFDF0; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        .compass-needle { width: 4px; height: 48px; background: #E53E3E; position: absolute; top: 12px; border-radius: 2px; transform-origin: bottom center; transition: transform 0.2s ease; }

        .rating-stars { display: flex; justify-content: center; gap: 8px; font-size: 1.8rem; color: #CBD5E0; margin: 12px 0; cursor: pointer; }
        .rating-stars .active { color: #FFD166; }
        .form-input { width: 100%; padding: 11px; border: 1px solid #E2E8F0; border-radius: 10px; margin-bottom: 10px; font-size: 0.88rem; }
        .submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .review-box { background: #F8FAFC; border-radius: 10px; padding: 10px 12px; margin-top: 8px; border: 1px solid #E2E8F0; text-align: right; }

        .quran-select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--secondary); font-size: 0.88rem; margin-bottom: 12px; background: white; }
        .surah-card { background: white; border: 1px solid #EDF2F7; padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="header-card">
        <h1>تطبيق الرسالة</h1>
        <div class="sub-title">اتباع هدي النبي ﷺ في الصلاة والأذكار والصيام</div>
        <p>«عَلَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ»</p>
    </div>

    <div class="action-bar">
        <button class="btn-main" id="installBtn" onclick="triggerInstall()">
            <i class="fa-solid fa-download"></i> تثبيت التطبيق
        </button>
        <button class="btn-main btn-share" onclick="shareApp()">
            <i class="fa-solid fa-share-nodes"></i> مشاركة التطبيق
        </button>
    </div>

    <div class="main-content">
        <div class="section-title">الأقسام الرئيسية</div>

        <div class="category-card" onclick="openQuran()">
            <div class="card-info">
                <div class="icon-box" style="color: var(--gold-soft); background: #FFFDF0;"><i class="fa-solid fa-quran"></i></div>
                <div class="card-title">القرآن الكريم (صوت وصورة)</div>
            </div>
            <i class="fa-solid fa-chevron-left" style="color:#A0AEC0; font-size:0.85rem;"></i>
        </div>

        <div class="category-card" onclick="openPrayerTimes()">
            <div class="card-info">
                <div class="icon-box"><i class="fa-solid fa-kaaba"></i></div>
                <div class="card-title">مواقيت الصلاة والقبلة والأذان</div>
            </div>
            <i class="fa-solid fa-chevron-left" style="color:#A0AEC0; font-size:0.85rem;"></i>
        </div>

        <div class="category-card" onclick="openAzkar()">
            <div class="card-info">
                <div class="icon-box"><i class="fa-solid fa-book-open"></i></div>
                <div class="card-title">أذكار المسلم (صوت وصورة)</div>
            </div>
            <i class="fa-solid fa-chevron-left" style="color:#A0AEC0; font-size:0.85rem;"></i>
        </div>

        <div class="category-card" onclick="openFasting()">
            <div class="card-info">
                <div class="icon-box"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="card-title">تذكير الصيام (الفرض والسنة)</div>
            </div>
            <i class="fa-solid fa-chevron-left" style="color:#A0AEC0; font-size:0.85rem;"></i>
        </div>

        <div class="category-card" onclick="openRating()">
            <div class="card-info">
                <div class="icon-box"><i class="fa-solid fa-star"></i></div>
                <div class="card-title">تقييم التطبيق وآراء المستخدمين</div>
            </div>
            <i class="fa-solid fa-chevron-left" style="color:#A0AEC0; font-size:0.85rem;"></i>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" style="color: var(--primary);"></h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        let deferredPrompt = null;
        let globalAudio = new Audio();
        let azanAudio = new Audio();
        let selectedRating = 5;

        // --- التحكم في إخفاء زر التثبيت عند تثبيت التطبيق فعلياً ---
        function checkAppInstallation() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const installBtn = document.getElementById('installBtn');
            if (isStandalone) {
                if (installBtn) installBtn.style.display = 'none';
            }
        }

        window.addEventListener('load', () => {
            checkAppInstallation();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(()=>{});
            }
            if ('Notification' in window && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
        });

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            checkAppInstallation();
        });

        window.addEventListener('appinstalled', () => {
            document.getElementById('installBtn').style.display = 'none';
            alert('تم تثبيت تطبيق الرسالة بنجاح على شاشة موبايلك!');
        });

        function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('installBtn').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            } else {
                alert("💡 التطبيق يعمل الآن كـ تطبيق مثبّت، أو يمكنك إضافة الصفحة مباشرة للشاشة الرئيسية عبر خيارات المتصفح (Add to Home Screen).");
            }
        }

        function shareApp() {
            const shareData = {
                title: 'تطبيق الرسالة 📱',
                text: '💡 أدعوك لتثبيت "تطبيق الرسالة" على هاتفك (أذكار، قرآن صوت وصورة، مواقيت الصلاة والأذان، وتذكير الصيام):\n',
                url: window.location.href
            };
            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareData.text + " " + shareData.url);
                alert("تم نسخ رابط ورسالة مشاركة تطبيق الرسالة بنجاح!");
            }
        }

        // --- أذكار المسلم وشبكة الصوت الناطقة ---
        const azkarList = [
            { title: "أذكار الصباح", text: "أَصْبَحْنَا وَأَصْبَحَ المُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ." },
            { title: "أذكار المساء", text: "أَمْسَيْنَا وَأَمْسَى المُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ." },
            { title: "أذكار النوم", text: "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ." },
            { title: "أذكار الاستيقاظ", text: "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ." },
            { title: "دعاء الخروج من المنزل", text: "بِسْمِ اللَّهِ ، تَوَكَّلْتُ عَلَى اللَّهِ ، وَلا حَوْلَ وَلا قُوَّةَ إِلاَّ بِاللَّهِ." },
            { title: "دعاء دخول المنزل", text: "بِسْمِ اللهِ وَلَجْنَا، وَبِسْمِ اللهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا." }
        ];

        function openAzkar() {
            document.getElementById('modal-title').innerText = "أذكار المسلم (صوت وصورة)";
            let html = '';
            azkarList.forEach((item) => {
                html += `
                    <div class="azkar-item">
                        <div class="azkar-title-row">
                            <span class="azkar-title">${item.title}</span>
                            <button class="audio-btn" onclick="speakAzkar('${item.text}')">
                                <i class="fa-solid fa-volume-high"></i> استماع للذكر 🔊
                            </button>
                        </div>
                        <div style="line-height:1.8; margin-top:6px; font-size:0.9rem; color:#2D3748;">${item.text}</div>
                    </div>
                `;
            });
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        function speakAzkar(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'ar-SA';
                msg.rate = 0.85;
                msg.pitch = 1;
                window.speechSynthesis.speak(msg);
            } else {
                alert(text);
            }
        }

        // --- مواقيت الصلاة واختيار صوت الأذان ---
        const azanMoazins = [
            { name: "أذان الحرم المكي (علي ملا)", url: "https://www.islamcan.com/audio/adhan/makkah.mp3" },
            { name: "أذان المسجد النبوي (المدني)", url: "https://www.islamcan.com/audio/adhan/madina.mp3" },
            { name: "أذان الشيخ مصطفى إسماعيل", url: "https://server8.mp3quran.net/afs/001.mp3" }
        ];

        function openPrayerTimes() {
            document.getElementById('modal-title').innerText = "مواقيت الصلاة والقبلة والأذان";
            let moazinOptions = azanMoazins.map((m, index) => `<option value="${m.url}">${m.name}</option>`).join('');

            let html = `
                <div>
                    <div class="prayer-time-card"><span>الفجر</span><span>05:19 ص</span></div>
                    <div class="prayer-time-card"><span>الظهر</span><span>12:46 م</span></div>
                    <div class="prayer-time-card"><span>العصر</span><span>04:12 م</span></div>
                    <div class="prayer-time-card"><span>المغرب</span><span>06:46 م</span></div>
                    <div class="prayer-time-card"><span>العشاء</span><span>08:03 م</span></div>

                    <div style="margin-top:14px; background:#F8FAFC; padding:12px; border-radius:12px; border:1px solid #E2E8F0;">
                        <label style="font-weight:bold; color:var(--primary); display:block; margin-bottom:6px;">اختر المؤذن وتجربة الصوت:</label>
                        <select id="moazinSelect" class="quran-select">${moazinOptions}</select>
                        <div style="display:flex; gap:8px;">
                            <button class="audio-btn" style="flex:1; justify-content:center;" onclick="testAzanAudio()">
                                <i class="fa-solid fa-play"></i> تجربة صوت الأذان 🔔
                            </button>
                            <button class="submit-btn" style="flex:1; padding:7px; font-size:0.85rem;" onclick="enableAzanNotifications()">
                                <i class="fa-solid fa-bell"></i> تفعيل الأذان
                            </button>
                        </div>
                    </div>

                    <div class="qibla-compass-box">
                        <h4 style="color:var(--primary); font-size:0.95rem;">بوصلة اتجاه القبلة</h4>
                        <div class="qibla-compass">
                            <div class="compass-needle" id="needle"></div>
                            <i class="fa-solid fa-kaaba" style="font-size:1.5rem; color:var(--primary);"></i>
                        </div>
                        <button class="audio-btn" style="margin:8px auto; background:var(--gold-soft);" onclick="startCompass()">
                            <i class="fa-solid fa-compass"></i> تشغيل القبلة التفاعلية
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        function testAzanAudio() {
            let azanUrl = document.getElementById('moazinSelect').value;
            if (azanAudio) azanAudio.pause();
            azanAudio.src = azanUrl;
            azanAudio.play().catch(() => alert("جاري تشغيل صوت الأذان..."));
        }

        function enableAzanNotifications() {
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        alert("تم تفعيل أذان التنبيهات بنجاح للمؤذن المختار!");
                    } else {
                        alert("يرجى السماح بالإشعارات في هاتفك ليتم إطلاق الأذان بوقت الصلاة.");
                    }
                });
            }
        }

        function startCompass() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function(e) {
                    let compass = e.alpha || e.webkitCompassHeading || 0;
                    let needle = document.getElementById('needle');
                    if (needle) needle.style.transform = `rotate(${360 - compass}deg)`;
                }, true);
                alert("تم تشغيل بوصلة القبلة بالهاتف بنجاح!");
            } else {
                alert("ميزة القبلة تتطلب حساس البوصلة بهاتفك المحمول.");
            }
        }

        // --- تذكير الصيام ---
        function openFasting() {
            document.getElementById('modal-title').innerText = "تذكير صيام الفرض والسنة";
            let html = `
                <div>
                    <div class="azkar-item">
                        <div class="azkar-title-row">
                            <span class="azkar-title">صيام الإثنين والخميس</span>
                            <span style="color:#2D6A4F; font-weight:bold; font-size:0.8rem;">سنة مؤكدة</span>
                        </div>
                        <p style="font-size:0.85rem; color:#4A5568;">سنة عن النبي ﷺ وكان يتحرى صيامهما.</p>
                    </div>
                    <div class="azkar-item">
                        <div class="azkar-title-row">
                            <span class="azkar-title">الأيام البيض (13، 14، 15 الهجرية)</span>
                            <span style="color:#2D6A4F; font-weight:bold; font-size:0.8rem;">سنة مؤكدة</span>
                        </div>
                        <p style="font-size:0.85rem; color:#4A5568;">صيامها كصيام الدهر.</p>
                    </div>
                    <button class="submit-btn" onclick="alert('تم تفعيل التنبيه الأسبوعي لصيام الفرض والسنة بنجاح!')">
                        <i class="fa-solid fa-clock-rotate-left"></i> تفعيل التنبيهات الأسبوعية
                    </button>
                </div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        // --- تقييم التطبيق مع الحفظ والتسجيل الفعلي ---
        function getSavedReviews() {
            let reviews = localStorage.getItem('resalah_reviews');
            if (reviews) {
                return JSON.parse(reviews);
            }
            return [
                { name: "أيمن هاشم", comment: "تطبيق مبارك وممتاز جداً، جزاكم الله كل خير.", rating: 5 }
            ];
        }

        function openRating() {
            document.getElementById('modal-title').innerText = "تقييم التطبيق وآراء المستخدمين";
            let reviews = getSavedReviews();
            let reviewsHTML = reviews.map(r => `
                <div class="review-box">
                    <strong>${r.name} ${'⭐'.repeat(r.rating)}</strong>
                    <p style="font-size:0.82rem; color:#4A5568; margin-top:2px;">${r.comment}</p>
                </div>
            `).join('');

            let html = `
                <div style="text-align: center;">
                    <div class="rating-stars" id="starContainer">
                        <i class="fa-solid fa-star active" onclick="setRating(1)"></i>
                        <i class="fa-solid fa-star active" onclick="setRating(2)"></i>
                        <i class="fa-solid fa-star active" onclick="setRating(3)"></i>
                        <i class="fa-solid fa-star active" onclick="setRating(4)"></i>
                        <i class="fa-solid fa-star active" onclick="setRating(5)"></i>
                    </div>
                    <input type="text" id="reviewerName" class="form-input" placeholder="الاسم الكريم">
                    <textarea id="reviewerComment" class="form-input" rows="2" placeholder="اكتب ملاحظاتك وآراءك المباركة..."></textarea>
                    <button class="submit-btn" onclick="submitReview()">إرسال التقييم</button>

                    <div style="margin-top:15px; text-align:right;">
                        <h4 style="font-size:0.9rem; color:var(--primary); margin-bottom:8px;">أحدث التقييمات:</h4>
                        <div id="reviewsList">${reviewsHTML}</div>
                    </div>
                </div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        function setRating(rating) {
            selectedRating = rating;
            let stars = document.querySelectorAll('#starContainer i');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function submitReview() {
            let name = document.getElementById('reviewerName').value.trim();
            let comment = document.getElementById('reviewerComment').value.trim();
            if(!name || !comment) { 
                alert("يرجى كتابة الاسم والملاحظات قبل إرسال التقييم."); 
                return; 
            }

            let reviews = getSavedReviews();
            reviews.unshift({ name: name, comment: comment, rating: selectedRating });
            localStorage.setItem('resalah_reviews', JSON.stringify(reviews));

            alert("تم تسجيل تقييمك المبارك بنجاح ونشره!");
            openRating(); // إعادة تحميل نافذة التقييم ليظهر مباشرة
        }

        // --- القرآن الكريم ---
        const reciters = [
            { server: "https://server13.mp3quran.net/husr/", name: "محمود خليل الحصري" },
            { server: "https://server7.mp3quran.net/basit/", name: "عبد الباسط عبد الصمد" },
            { server: "https://server8.mp3quran.net/afs/", name: "مشاري راشد العفاسي" }
        ];

        const allSurahs = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبيـاء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الإنفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","المعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

        function openQuran() {
            document.getElementById('modal-title').innerText = "القرآن الكريم (صوت وصورة)";
            let reciterOptions = reciters.map((r) => `<option value="${r.server}">${r.name}</option>`).join('');
            
            let surahList = allSurahs.map((sName, idx) => {
                let sNum = (idx + 1).toString().padStart(3, '0');
                return `
                    <div class="surah-card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>سورة ${sName} (${idx + 1})</strong>
                            <button class="audio-btn" onclick="playSurah('${sNum}')">
                                <i class="fa-solid fa-play"></i> استماع
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            let html = `
                <div>
                    <label style="font-weight:bold; color:var(--primary); display:block; margin-bottom:6px;">اختر القارئ:</label>
                    <select id="reciterSelect" class="quran-select">${reciterOptions}</select>
                    <div style="max-height: 50vh; overflow-y: auto;">${surahList}</div>
                </div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        function playSurah(sNum) {
            let serverUrl = document.getElementById('reciterSelect').value;
            if (globalAudio) globalAudio.pause();
            globalAudio.src = `${serverUrl}${sNum}.mp3`;
            globalAudio.play().catch(() => alert("جاري الاتصال بالسيرفر الصوتي..."));
        }

        function closeModal() {
            if (globalAudio) globalAudio.pause();
            if (azanAudio) azanAudio.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
