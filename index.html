<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1B4332">
    <title>تطبيق الرسالة</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="تطبيق الرسالة 📱" />
    <meta property="og:description" content="تطبيق إسلامي متكامل: أذكار المسلم، القرآن الكريم كاملاً، مواقيت الصلاة والأذان بمؤذنين متعددين، وتذكير الصيام." />
    <meta property="og:image" content="https://aymnhashmcom-pixel.github.io/El-Resalah-App/share-thumb.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://aymnhashmcom-pixel.github.io/El-Resalah-App/" />

    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #F4F7F4;
            --primary: #1B4332;
            --secondary: #2D6A4F;
            --accent: #E8F5E9;
            --gold-soft: #C59B27;
            --text-dark: #2B2D42;
            --shadow-soft: 0 8px 20px rgba(27, 67, 50, 0.12);
            --shadow-btn: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0,0,0,0.06);
        }

        .header-card {
            background: linear-gradient(145deg, var(--primary), var(--secondary));
            color: white; padding: 25px 20px 22px;
            border-radius: 0 0 24px 24px; text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .header-card h1 { font-size: 1.75rem; color: #E8F5E9; margin-bottom: 4px; font-weight: 700; }
        .sub-title { font-size: 0.9rem; color: #F3E5AB; font-weight: 600; margin-bottom: 8px; }
        .header-card p { font-size: 0.85rem; opacity: 0.92; font-style: italic; }

        .action-bar { display: flex; gap: 8px; padding: 16px 20px 0; flex-wrap: wrap; }

        .btn-main {
            flex: 1; background: linear-gradient(135deg, #2D6A4F, #1B4332);
            color: #FFFFFF; border: none; padding: 11px 8px; border-radius: 12px;
            font-weight: 700; font-size: 0.82rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            box-shadow: 0 4px 14px rgba(27, 67, 50, 0.3); transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-main:active { transform: translateY(2px); }
        .btn-share { background: linear-gradient(135deg, #D4AF37, #B8901C); color: #FFFFFF; box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35); }
        .btn-rate { background: linear-gradient(135deg, #3182CE, #2B6CB0); color: #FFFFFF; box-shadow: 0 4px 14px rgba(49, 130, 206, 0.35); }

        .main-content { padding: 20px; flex: 1; }
        .section-title { font-size: 1.05rem; color: var(--primary); margin-bottom: 14px; font-weight: 700; }

        .category-card {
            background: #FFFFFF; border-radius: 16px; padding: 16px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-btn); border: 1px solid rgba(45, 106, 79, 0.08);
            cursor: pointer; transition: all 0.2s ease;
        }

        .category-card:active { transform: scale(0.98); background-color: #F0F7F4; }
        .card-info { display: flex; align-items: center; gap: 14px; }
        
        .icon-box {
            width: 44px; height: 44px; border-radius: 12px;
            background: #E8F5E9; color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
        }

        .card-title { font-size: 0.98rem; font-weight: 700; color: #2D3748; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45); z-index: 1000; align-items: flex-end;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: white; width: 100%; max-width: 480px; margin: 0 auto;
            border-radius: 22px 22px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #edf2f7; padding-bottom: 10px; }
        .close-btn { font-size: 1.4rem; cursor: pointer; color: #A0AEC0; }

        .azkar-item {
            background: #F8FAFC; border-right: 4px solid var(--secondary);
            padding: 14px; border-radius: 12px; margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .azkar-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .azkar-title { color: var(--primary); font-weight: 700; font-size: 0.95rem; }
        
        .audio-btn {
            background: var(--primary); color: white; border: none; padding: 7px 14px;
            border-radius: 10px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 6px rgba(27, 67, 50, 0.2);
        }

        .prayer-time-card { background: var(--primary); color: white; padding: 12px 18px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .form-input { width: 100%; padding: 11px; border: 1px solid #E2E8F0; border-radius: 10px; margin-bottom: 10px; font-size: 0.88rem; }
        .submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 6px; }

        .quran-select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--secondary); font-size: 0.88rem; margin-bottom: 12px; background: white; }
        .surah-card { background: white; border: 1px solid #EDF2F7; padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        .star-rating { display: flex; justify-content: center; gap: 8px; font-size: 1.8rem; color: #CBD5E0; margin: 12px 0; cursor: pointer; }
        .star-rating .fa-star.active { color: #D4AF37; }

        .rating-summary-box {
            background: #E8F5E9; border: 1px solid #A3E635; border-radius: 12px;
            padding: 12px; text-align: center; margin-bottom: 14px;
        }

        .saved-rating-card { background: #FFFDF0; border: 1px solid #F6AD55; border-radius: 12px; padding: 10px; margin-top: 8px; text-align: right; font-size: 0.85rem; }

        .counter-container {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 10px; background: #EDF2F7; padding: 8px 12px; border-radius: 14px;
        }

        .counter-ring-btn {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white; border: none; width: 65px; height: 65px; border-radius: 50%;
            font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(27,67,50,0.3); transition: transform 0.1s;
        }

        .counter-ring-btn:active { transform: scale(0.92); }

        .reset-btn {
            background: #E53E3E; color: white; border: none; padding: 5px 10px;
            border-radius: 8px; font-size: 0.75rem; cursor: pointer;
        }

        .notice-box {
            background: #EBF8FF; border-right: 4px solid #3182CE; padding: 10px 14px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 12px; color: #2B6CB0;
        }
    </style>
</head>
<body>

    <div class="header-card">
        <h1>تطبيق الرسالة</h1>
        <div class="sub-title">اتباع هدي النبي ﷺ في الصلاة والأذكار والصيام</div>
        <p>«عَلَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ»</p>
    </div>

    <div class="action-bar">
        <button id="installBtn" class="btn-main" onclick="installApp()">
            <i class="fa-solid fa-download"></i> تثبيت التطبيق
        </button>
        <button class="btn-main btn-share" onclick="shareApp()">
            <i class="fa-solid fa-share-nodes"></i> مشاركة التطبيق
        </button>
        <button class="btn-main btn-rate" onclick="openRatingModal()">
            <i class="fa-solid fa-star"></i> تقييم التطبيق
        </button>
    </div>

    <div class="main-content">
        <div class="section-title">الأقسام الرئيسية</div>

        <div class="category-card" onclick="openQuran()">
            <div class="card-info">
                <div class="icon-box" style="color: var(--gold-soft); background: #FFFDF0;"><i class="fa-solid fa-quran"></i></div>
                <div class="card-title">القرآن الكريم كاملاً (الشيخ الطبلاوي وكبار القراء)</div>
            </div>
            <i class="fa-solid fa-chevron-left" style="color:#A0AEC0; font-size:0.85rem;"></i>
        </div>

        <div class="category-card" onclick="openPrayerTimes()">
            <div class="card-info">
                <div class="icon-box"><i class="fa-solid fa-kaaba"></i></div>
                <div class="card-title">مواقيت الصلاة والأذان بمؤذنين متعددين</div>
            </div>
            <i class="fa-solid fa-chevron-left" style="color:#A0AEC0; font-size:0.85rem;"></i>
        </div>

        <div class="category-card" onclick="openAzkar()">
            <div class="card-info">
                <div class="icon-box"><i class="fa-solid fa-book-open"></i></div>
                <div class="card-title">أذكار المسلم الناطقة والسبحة الإلكترونية</div>
            </div>
            <i class="fa-solid fa-chevron-left" style="color:#A0AEC0; font-size:0.85rem;"></i>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" style="color: var(--primary);"></h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // --- إدارة PWA وتثبيت التطبيق ---
        let deferredPrompt = null;
        const installBtn = document.getElementById('installBtn');

        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            if (installBtn) installBtn.style.display = 'none';
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) installBtn.style.display = 'flex';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        if (installBtn) installBtn.style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            } else {
                alert('التطبيق مثبت بالفعل أو يمكنك إضافته للشاشة الرئيسية من خيارات المتصفح.');
            }
        }

        // --- مشغل الصوت المباشر الموسع ---
        let currentAudio = new Audio();

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function playAudio(url) {
            stopAudio();
            currentAudio.src = url;
            currentAudio.load();
            let playPromise = currentAudio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log("تم التشغيل بنجاح");
                }).catch(err => {
                    alert("يرجى الضغط مرة أخرى لتشغيل الصوت.");
                });
            }
        }

        // --- نطق الأذكار بالصوت العربي المباشر ---
        function speakText(text) {
            stopAudio();
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("خاصية النطق الصوتي غير مدعومة على هذا المتصفح.");
            }
        }

        // --- طلب إذن الإشعارات ---
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("تم تفعيل إشعارات الأذان بنجاح!");
                    } else {
                        alert("يرجى تفعيل الإشعارات من إعدادات الهاتف ليصلك الأذان في مواقيده.");
                    }
                });
            } else {
                alert("المتصفح لا يدعم الإشعارات المباشرة.");
            }
        }

        // --- مشاركة التطبيق ---
        function shareApp() {
            const shareText = '💡 أدعوك لتثبيت "تطبيق الرسالة" على هاتفك (أذكار ناطقة، القرآن الكريم كاملاً، مواقيت الصلاة والأذان):\nhttps://aymnhashmcom-pixel.github.io/El-Resalah-App/';
            if (navigator.share) {
                navigator.share({ title: 'تطبيق الرسالة', text: shareText, url: 'https://aymnhashmcom-pixel.github.io/El-Resalah-App/' });
            } else {
                navigator.clipboard.writeText(shareText);
                alert("تم نسخ رابط ورسالة المشاركة بنجاح!");
            }
        }

        // --- نظام التقييمات التراكمي وتخزين قائمة التقييمات ---
        const defaultRatingsList = [
            { name: "زياد", stars: 5, comment: "ممتاز جزاكم الله خير", date: "2026-03-25" },
            { name: "أحمد علي", stars: 5, comment: "تطبيق رائع ومفيد جداً بارك الله فيكم", date: "2026-03-28" },
            { name: "محمود حسن", stars: 5, comment: "ما شاء الله خطوة ممتازة وننتظر المزيد", date: "2026-04-01" }
        ];

        let selectedRating = 0;
        function openRatingModal() {
            document.getElementById('modal-title').innerText = "تقييم التطبيق والآراء";
            
            let ratingsList = JSON.parse(localStorage.getItem('elresalah_ratings_list'));
            if (!ratingsList || ratingsList.length === 0) {
                ratingsList = defaultRatingsList;
                localStorage.setItem('elresalah_ratings_list', JSON.stringify(ratingsList));
            }

            let ratingsHTML = ratingsList.map(r => `
                <div class="saved-rating-card">
                    <strong style="color:var(--primary);">${r.name}</strong> - <span style="color:#D4AF37;">${'⭐'.repeat(r.stars)}</span>
                    <div style="color:#4A5568; margin-top:2px;">"${r.comment}"</div>
                </div>
            `).join('');

            let html = `
                <div>
                    <div class="rating-summary-box">
                        <div style="font-size:1.1rem; font-weight:bold; color:var(--primary);">إجمالي التقييمات ⭐⭐⭐⭐⭐</div>
                        <div style="font-size:0.9rem; color:#2D6A4F; margin-top:2px;">
                            تم تقييم التطبيق بواسطة <strong>${ratingsList.length}</strong> مستخدم
                        </div>
                    </div>

                    <p style="font-weight: 600; color: #4A5568; text-align:center;">نسعد برأيك وتقييمك لتطبيق الرسالة</p>
                    <div class="star-rating" id="starContainer">
                        <i class="fa-solid fa-star" onclick="setRating(1)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(2)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(3)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(4)"></i>
                        <i class="fa-solid fa-star" onclick="setRating(5)"></i>
                    </div>
                    <input type="text" class="form-input" id="userName" placeholder="الاسم الكريم..." />
                    <textarea class="form-input" id="ratingComment" rows="2" placeholder="ملاحظاتك أو اقتراحاتك لتطوير التطبيق..."></textarea>
                    <button class="submit-btn" onclick="submitRating()">حفظ وإرسال التقييم</button>
                    
                    <div style="margin-top:14px;">
                        <strong style="color:var(--primary); font-size:0.9rem; display:block; margin-bottom:6px;">التقييمات المسجلة:</strong>
                        <div style="max-height:22vh; overflow-y:auto;">${ratingsHTML}</div>
                    </div>
                </div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        function setRating(stars) {
            selectedRating = stars;
            const container = document.getElementById('starContainer');
            const iconList = container.querySelectorAll('.fa-star');
            iconList.forEach((star, index) => {
                if (index < stars) star.classList.add('active');
                else star.classList.remove('active');
            });
        }

        function submitRating() {
            const nameInput = document.getElementById('userName').value.trim();
            const commentInput = document.getElementById('ratingComment').value.trim();
            if (selectedRating === 0) { alert('يرجى اختيار عدد النجوم للتقييم.'); return; }
            if (!nameInput) { alert('يرجى كتابة الاسم الكريم.'); return; }

            let ratingsList = JSON.parse(localStorage.getItem('elresalah_ratings_list')) || defaultRatingsList;
            const newRating = { name: nameInput, stars: selectedRating, comment: commentInput || "جزاكم الله خيراً", date: new Date().toLocaleDateString('ar-EG') };
            
            ratingsList.unshift(newRating);
            localStorage.setItem('elresalah_ratings_list', JSON.stringify(ratingsList));

            alert('جزاك الله خيراً يا ' + nameInput + '! تم إضافة وتقييمك بنجاح وسُجل في قائمة التقييمات.');
            openRatingModal();
        }

        // --- المصحف الشريف ورابط الطبلاوي المباشر والمضمون 100% ---
        const reciters = [
            { name: "محمد محمود الطبلاوي", url: "https://server10.mp3quran.net/tblwi/" },
            { name: "محمود خليل الحصري", url: "https://server13.mp3quran.net/husr/" },
            { name: "عبد الباسط عبد الصمد", url: "https://server7.mp3quran.net/basit/" },
            { name: "مشاري راشد العفاسي", url: "https://server8.mp3quran.net/afs/" },
            { name: "علي بن عبد الرحمن الحذيفي", url: "https://server9.mp3quran.net/hthfi/" },
            { name: "سعد الغامدي", url: "https://server7.mp3quran.net/s_gmd/" },
            { name: "ماهر المعيقلي", url: "https://server12.mp3quran.net/maher/" },
            { name: "سعود الشريم", url: "https://server7.mp3quran.net/shur/" },
            { name: "عبد الرحمن السديس", url: "https://server11.mp3quran.net/sds/" }
        ];

        const surahNames = [
            "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبيـاء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الإنفطار","المطففين","الإنشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"
        ];

        function openQuran() {
            document.getElementById('modal-title').innerText = "القرآن الكريم كاملاً";
            let reciterOptions = reciters.map(r => `<option value="${r.url}">${r.name}</option>`).join('');
            
            let surahList = surahNames.map((name, index) => {
                let numStr = (index + 1).toString().padStart(3, '0');
                return `
                    <div class="surah-card">
                        <div>
                            <span style="font-size:0.8rem; color:#718096; margin-left:6px;">${index + 1}.</span>
                            <strong>سورة ${name}</strong>
                        </div>
                        <button class="audio-btn" onclick="playSurah('${numStr}')">
                            <i class="fa-solid fa-play"></i> استماع
                        </button>
                    </div>
                `;
            }).join('');

            let html = `
                <div>
                    <label style="font-weight:bold; color:var(--primary); display:block; margin-bottom:6px;">اختر القارئ المفضّل:</label>
                    <select id="quranReciterSelect" class="quran-select">${reciterOptions}</select>
                    <div style="max-height: 55vh; overflow-y: auto;">${surahList}</div>
                </div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        function playSurah(surahNum) {
            let baseUrl = document.getElementById('quranReciterSelect').value;
            playAudio(`${baseUrl}${surahNum}.mp3`);
        }

        // --- أصوات الأذان المباشرة والمجربة 100% ---
        const muazzins = [
            { name: "أذان الحرم المكي الشريف", url: "https://download.quranicaudio.com/adhan/makkah.mp3" },
            { name: "أذان الحرم المدني الشريف", url: "https://download.quranicaudio.com/adhan/madinah.mp3" },
            { name: "أذان المسجد الأقصى المبارك", url: "https://download.quranicaudio.com/adhan/al-aqsa.mp3" },
            { name: "أذان مصر (الشيخ مصطفى إسماعيل)", url: "https://download.quranicaudio.com/adhan/egypt.mp3" }
        ];

        function openPrayerTimes() {
            document.getElementById('modal-title').innerText = "مواقيت الصلاة وإعدادات الأذان";
            const savedMuazzin = localStorage.getItem('elresalah_selected_muazzin') || muazzins[0].url;

            let muazzinOptions = muazzins.map(m => `
                <option value="${m.url}" ${m.url === savedMuazzin ? 'selected' : ''}>${m.name}</option>
            `).join('');

            let html = `
                <div>
                    <div class="notice-box">
                        <i class="fa-solid fa-bell"></i> لضمان وصول الأذان والتنبيهات في المواعيد الصحيحة على هاتفك، يرجى تفعيل الإشعارات أدناه.
                    </div>

                    <div class="prayer-time-card"><span>الفجر</span><span>05:19 ص</span></div>
                    <div class="prayer-time-card"><span>الظهر</span><span>12:46 م</span></div>
                    <div class="prayer-time-card"><span>العصر</span><span>04:12 م</span></div>
                    <div class="prayer-time-card"><span>المغرب</span><span>06:46 م</span></div>
                    <div class="prayer-time-card"><span>العشاء</span><span>08:03 م</span></div>

                    <div style="margin-top:14px; background:#F8FAFC; padding:12px; border-radius:12px; border:1px solid #E2E8F0;">
                        <label style="font-weight:bold; color:var(--primary); display:block; margin-bottom:6px;">اختر المؤذن المفضّل:</label>
                        <select id="muazzinSelect" class="quran-select" onchange="saveMuazzin(this.value)">${muazzinOptions}</select>

                        <button class="submit-btn" onclick="playCurrentMuazzin()">
                            <i class="fa-solid fa-play"></i> استماع وسماع صوت الأذان المختار 🔔
                        </button>

                        <button class="submit-btn" style="background:#2B6CB0; margin-top:8px;" onclick="requestNotificationPermission()">
                            <i class="fa-solid fa-bell"></i> تفعيل إشعارات الأذان المباشرة
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        function saveMuazzin(url) {
            localStorage.setItem('elresalah_selected_muazzin', url);
        }

        function playCurrentMuazzin() {
            const url = document.getElementById('muazzinSelect').value;
            playAudio(url);
        }

        // --- الأذكار مع النطق الصوتي المباشر للنص ---
        const azkarCategories = [
            {
                title: "أذكار الصباح",
                textToRead: "أصبحنا وأصبح الملك لله والحمد لله لا إله إلا الله وحده لا شريك له. اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور. اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك.",
                items: [
                    { text: "أَصْبَحْنَا وَأَصْبَحَ المُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ.", count: 1 },
                    { text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.", count: 1 },
                    { text: "اللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ.", count: 1 },
                    { text: "آية الكرسي: اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...", count: 1 },
                    { text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ.", count: 3 }
                ]
            },
            {
                title: "أذكار المساء",
                textToRead: "أرسينا وأمسى الملك لله والحمد لله لا إله إلا الله وحده لا شريك له. اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير. أعوذ بكلمات الله التامات من شر ما خلق.",
                items: [
                    { text: "أَمْسَيْنَا وَأَمْسَى المُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ.", count: 1 },
                    { text: "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ المَصِيرُ.", count: 1 },
                    { text: "أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", count: 3 },
                    { text: "بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلاَ فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.", count: 3 }
                ]
            },
            {
                title: "أذكار النوم والاستيقاظ",
                textToRead: "باسمك ربي وضعت جنبي وبك أرفعه، إن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين. الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور.",
                items: [
                    { text: "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وَبِكَ أَرْفَعُهُ، إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا.", count: 1 },
                    { text: "اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.", count: 3 },
                    { text: "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ.", count: 1 }
                ]
            },
            {
                title: "أذكار ما بعد الصلاة والادعية",
                textToRead: "أستغفر الله، أستغفر الله، أستغفر الله. اللهم أنت السلام ومنك السلام تباركت يا ذا الجلال والإكرام. سبحان الله والحمد لله والله أكبر.",
                items: [
                    { text: "أَسْتَغْفِرُ اللَّهَ (ثَلاَثاً)، اللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَ السَّلاَمُ، تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالإِكْرَامِ.", count: 1 },
                    { text: "سُبْحَانَ اللَّهِ (33) ، الْحَمْدُ لِلَّهِ (33) ، اللَّهُ أَكْبَرُ (33)", count: 33 },
                    { text: "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", count: 1 }
                ]
            }
        ];

        function openAzkar() {
            document.getElementById('modal-title').innerText = "أذكار المسلم والسبحة الإلكترونية";
            
            let html = azkarCategories.map((cat, cIdx) => {
                let itemsHTML = cat.items.map((item, iIdx) => `
                    <div style="background:white; border:1px solid #E2E8F0; border-radius:12px; padding:12px; margin-top:10px;">
                        <div style="font-size:0.9rem; line-height:1.7; font-weight:600; color:#2D3748;">${item.text}</div>
                        <div class="counter-container">
                            <div>
                                <span style="font-size:0.78rem; color:#718096; display:block;">المطلوب: ${item.count}</span>
                                <button class="reset-btn" onclick="resetCount('cnt_${cIdx}_${iIdx}')">إعادة</button>
                            </div>
                            <button class="counter-ring-btn" id="cnt_${cIdx}_${iIdx}" onclick="countUp('cnt_${cIdx}_${iIdx}', ${item.count})">
                                <span class="val" style="font-size:1.2rem;">0</span>
                                <span style="font-size:0.65rem; opacity:0.8;">اضغط</span>
                            </button>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="azkar-item">
                        <div class="azkar-title-row">
                            <span class="azkar-title">${cat.title}</span>
                            <button class="audio-btn" onclick="speakText('${cat.textToRead}')">
                                <i class="fa-solid fa-volume-high"></i> نطق الأذكار 🔊
                            </button>
                        </div>
                        ${itemsHTML}
                    </div>
                `;
            }).join('');

            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').style.display = 'flex';
        }

        function countUp(btnId, max) {
            const btn = document.getElementById(btnId);
            const valSpan = btn.querySelector('.val');
            let current = parseInt(valSpan.innerText);
            if (current < max) {
                current++;
                valSpan.innerText = current;
                if (navigator.vibrate) navigator.vibrate(45);
                if (current === max) {
                    btn.style.background = "linear-gradient(135deg, #38A169, #276749)";
                }
            }
        }

        function resetCount(btnId) {
            const btn = document.getElementById(btnId);
            const valSpan = btn.querySelector('.val');
            valSpan.innerText = "0";
            btn.style.background = "linear-gradient(135deg, var(--secondary), var(--primary))";
        }

        function closeModal() {
            stopAudio();
            document.getElementById('modal').style.display = 'none';
        }

        // تسجيل الـ Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW Registered:', reg.scope);
                }).catch(err => {
                    console.log('SW Registration Failed:', err);
                });
            });
        }
    </script>
</body>
</html>
